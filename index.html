    .button {

    .button.primary {

    }

    .lang-toggle {

    .profile-links {

    .profile-link {

      padding: 10px 12px;
      border-radius: 10px;

    .profile-link strong {

      font-size: 13px;
      line-height: 1.2;
    }

    .profile-link span {

      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;

      height: 28px;

      border-radius: 8px;
      background: var(--soft);
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;

    .stats {

      gap: 10px;
      margin: 24px 0 30px;
    }

    .stat {
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);

      display: block;
      font-size: 22px;
      line-height: 1.1;

      color: var(--muted);
      font-size: 12px;

      color: var(--muted);

      line-height: 1.5;

      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: var(--solid);
      font-size: 13px;

    .search:focus {

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      min-height: 132px;
      display: flex;
      flex-direction: column;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      transition: transform .15s ease, border-color .15s ease;
    }

    .card:hover {
      transform: translateY(-1px);
      border-color: rgba(9,105,218,.5);
    }

    .web-card {
      min-height: 126px;
      border-top: 2px solid var(--green);
    }

    .card-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 8px;
    }

    .repo-name {
      margin: 0;
      color: var(--accent);
      font-size: 15px;
      line-height: 1.3;
      word-break: break-word;

    .badge {

      color: var(--accent);
      background: var(--soft);
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;

      font-size: 12px;
      line-height: 1.48;

    const githubIcon = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 .7a11.3 11.3 0 0 0-3.6 22c.6.1.8-.2.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.8.1-.8 1.2.1 1.9 1.3 1.9 1.3 1.1 1.9 2.9 1.3 3.6 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C16.5 4 17.5 4.3 17.5 4.3c.6 1.6.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6A11.3 11.3 0 0 0 12 .7Z"/>
      </svg>
    `;

    const escapeHtml = (value = "") =>
      String(value).replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[c]));

    const formatDate = value => {
      if (!value) return "";
      return new Intl.DateTimeFormat(currentLang === "zh" ? "zh-CN" : "en-US", {
        year: "numeric",
        month: "short",
        day: "numeric"
      }).format(new Date(value));
    };

    const pageUrl = repo => {
      const homepage = (repo.homepage || "").trim();
      if (homepage && /^https?:\/\//i.test(homepage)) return homepage;
      if (repo.name.toLowerCase() === `${USER.toLowerCase()}.github.io`) {
        return `https://${USER}.github.io/`;
      }
      return `https://${USER}.github.io/${encodeURIComponent(repo.name)}/`;
    };

    function applyLanguage() {
      const t = texts[currentLang];
      document.documentElement.lang = currentLang === "zh" ? "zh-CN" : "en";
      document.getElementById("langToggle").textContent = currentLang === "zh" ? "EN" : "中文";
      document.getElementById("search").placeholder = t.searchPlaceholder;

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        if (t[key]) el.textContent = t[key];
      });

      document.querySelector('meta[name="description"]').setAttribute(
        "content",
        currentLang === "zh"
          ? "AaronChou313 的公开项目与 GitHub Pages 项目展示页"
          : "AaronChou313's public projects and GitHub Pages showcase"
      );

      document.title = currentLang === "zh"
        ? "AaronChou313 · 项目主页"
        : "AaronChou313 · Projects";

      const bio = document.getElementById("bio");
      if (bio.dataset.fromProfile !== "true") bio.textContent = t.defaultBio;

      if (repos.length) {
        renderPages();
        renderRepositories(filterRepos());
      }
    }

    function repoCard(repo) {
      const t = texts[currentLang];
      return `
        <article class="card">
          <div class="card-top">
            <h3 class="repo-name">${escapeHtml(repo.name)}</h3>
            ${repo.archived ? '<span class="badge">Archived</span>' : ""}
          </div>

          <p class="desc">${escapeHtml(repo.description || t.noDescription)}</p>

          <div class="meta">
            ${repo.language ? `<span><span class="lang-dot"></span>${escapeHtml(repo.language)}</span>` : ""}
            <span>★ ${repo.stargazers_count || 0}</span>
            <span>⑂ ${repo.forks_count || 0}</span>
          </div>

          <div class="card-actions">
            <a
              class="icon-button"
              href="${escapeHtml(repo.html_url)}"
              target="_blank"
              rel="noreferrer"
              aria-label="GitHub"
              title="GitHub"
            >${githubIcon}</a>

            ${repo.has_pages ? `
              <a class="mini-link" href="${escapeHtml(pageUrl(repo))}" target="_blank" rel="noreferrer">
                ${escapeHtml(t.openWebsite)} ↗
              </a>
            ` : ""}

            ${repo.updated_at ? `<span class="meta">${escapeHtml(t.updated)} ${escapeHtml(formatDate(repo.updated_at))}</span>` : ""}
          </div>
        </article>
      `;
    }

    function pageRepoCard(repo) {
      const t = texts[currentLang];
      return `
        <article class="card web-card">
          <div class="card-top">
            <h3 class="repo-name">${escapeHtml(repo.name)}</h3>
            <span class="badge">${escapeHtml(t.githubPages)}</span>
          </div>

          <p class="desc">${escapeHtml(repo.description || t.noDescription)}</p>

          <div class="meta">
            ${repo.language ? `<span><span class="lang-dot"></span>${escapeHtml(repo.language)}</span>` : ""}
            <span>★ ${repo.stargazers_count || 0}</span>
          </div>

          <div class="card-actions">
            <a class="mini-link" href="${escapeHtml(pageUrl(repo))}" target="_blank" rel="noreferrer">
              ${escapeHtml(t.openWebsite)} ↗
            </a>

            <a
              class="icon-button"
              href="${escapeHtml(repo.html_url)}"
              target="_blank"
              rel="noreferrer"
              aria-label="GitHub"
              title="GitHub"
            >${githubIcon}</a>
          </div>
        </article>
      `;
    }

    async function fetchAllRepos() {
      const all = [];
      let page = 1;

      while (true) {
        const response = await fetch(
          `${REPOS_API}?per_page=100&page=${page}&sort=updated&type=owner`,
          { headers: { "Accept": "application/vnd.github+json" } }
        );

        if (!response.ok) throw new Error(`GitHub API ${response.status}`);

        const batch = await response.json();
        all.push(...batch);

        if (batch.length < 100) break;
        page += 1;
      }

      return all;
    }

    function filterRepos() {
      const keyword = document.getElementById("search").value.trim().toLowerCase();
      if (!keyword) return repos;

      return repos.filter(repo => {
        const haystack = [
          repo.name,
          repo.description,
          repo.language,
          ...(repo.topics || [])
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        return haystack.includes(keyword);
      });
    }

    function renderRepositories(list) {
      const grid = document.getElementById("repoGrid");
      const t = texts[currentLang];

      if (!list.length) {
        grid.innerHTML = `<div class="empty">${escapeHtml(t.noMatch)}</div>`;
        return;
      }

      grid.innerHTML = list.map(repoCard).join("");
    }

    function renderPages() {
      const grid = document.getElementById("pagesGrid");

      const pageRepos = repos
        .filter(repo =>
          repo.has_pages &&
          repo.name.toLowerCase() !== `${USER.toLowerCase()}.github.io`
        )
        .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

      grid.innerHTML = pageRepos.length
        ? pageRepos.map(pageRepoCard).join("")
        : `<div class="empty">${texts[currentLang].noMatch}</div>`;

      document.getElementById("pageCount").textContent = pageRepos.length;
    }

    function updateStats() {
      document.getElementById("repoCount").textContent = repos.length;
      document.getElementById("starCount").textContent =
        repos.reduce((sum, repo) => sum + (repo.stargazers_count || 0), 0);
    }

    async function refreshProfile() {
      try {
        const profileResponse = await fetch(PROFILE_API, {
          headers: { "Accept": "application/vnd.github+json" }
        });

        if (!profileResponse.ok) return;

        const profile = await profileResponse.json();

        document.getElementById("displayName").textContent =
          profile.name || profile.login || USER;

        if (profile.avatar_url) {
          document.getElementById("avatar").src = profile.avatar_url;
        }

        if (profile.bio) {
          const bio = document.getElementById("bio");
          bio.textContent = profile.bio;
          bio.dataset.fromProfile = "true";
        }
      } catch (error) {
        console.warn("Profile refresh skipped:", error);
      }
    }

    async function refreshRepos() {
      try {
        const repoData = await fetchAllRepos();

        if (!Array.isArray(repoData) || !repoData.length) return;

        repos = repoData
          .filter(repo => !repo.private)
          .sort((a, b) => new Date(b.updated_at || 0) - new Date(a.updated_at || 0));

        updateStats();
        renderPages();
        renderRepositories(filterRepos());
      } catch (error) {
        // 不覆盖已经显示的内置数据。
        console.warn("GitHub API refresh skipped; using embedded repository data:", error);
      }
    }

    async function init() {
      document.getElementById("year").textContent = new Date().getFullYear();

      document.getElementById("langToggle").addEventListener("click", () => {
        currentLang = currentLang === "zh" ? "en" : "zh";
        try { localStorage.setItem("lang", currentLang); } catch (_) {}
        applyLanguage();
      });

      document.getElementById("search").addEventListener("input", () => {
        renderRepositories(filterRepos());
      });

      // 先同步渲染内置数据，页面打开即有内容。
      applyLanguage();
      updateStats();
      renderPages();
      renderRepositories(repos);

      // 再异步尝试获取最新 GitHub 数据；失败也不会清空页面。
      refreshProfile();
      refreshRepos();
    }

    init();
  </script>
</body>
</html>
