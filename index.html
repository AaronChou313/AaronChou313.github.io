<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="AaronChou313 的公开项目与 GitHub Pages 项目展示页" />
  <meta name="color-scheme" content="light dark" />
  <title>AaronChou313 · 项目主页</title>

  <style>
    :root {
      --bg: #f6f8fa;
      --panel: rgba(255,255,255,.88);
      --solid: #fff;
      --text: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --accent: #0969da;
      --green: #1f883d;
      --soft: #ddf4ff;
      --pin-soft: #fff8c5;
      --pin-text: #9a6700;
      --shadow: 0 6px 22px rgba(140,149,159,.12);
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --panel: rgba(22,27,34,.9);
        --solid: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --accent: #58a6ff;
        --green: #3fb950;
        --soft: rgba(56,139,253,.15);
        --pin-soft: rgba(187,128,9,.18);
        --pin-text: #d29922;
        --shadow: 0 8px 24px rgba(0,0,0,.24);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, rgba(9,105,218,.08), transparent 24rem),
        radial-gradient(circle at 88% 4%, rgba(130,80,223,.06), transparent 22rem),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .wrap {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    header { padding: 42px 0 22px; }

    .hero {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 18px;
    }

    .avatar {
      width: 76px;
      height: 76px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--solid);
      box-shadow: var(--shadow);
    }

    .hero-copy { min-width: 0; }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(29px, 4vw, 40px);
      line-height: 1.05;
      letter-spacing: -.03em;
    }

    .bio {
      max-width: 690px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .hero-actions,
    .profile-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hero-actions { margin-top: 13px; }

    .button,
    .profile-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      background: var(--solid);
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    .button:hover,
    .profile-link:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    /* 中英文切换时保持固定宽度，避免按钮左右跳动。 */
    .button {
      width: 110px;
      min-height: 34px;
      padding: 0 8px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
    }

    .button.primary {
      color: #fff;
      background: var(--green);
      border-color: var(--green);
    }

    .lang-toggle {
      width: 64px;
      cursor: pointer;
    }

    .profile-links {
      max-width: 260px;
      justify-content: flex-end;
    }

    .profile-link {
      width: 100%;
      justify-content: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      box-shadow: var(--shadow);
    }

    .profile-link strong {
      display: block;
      font-size: 13px;
      line-height: 1.2;
    }

    .profile-link .subtitle {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .profile-link .mark {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--soft);
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 24px 0 30px;
    }

    .stat {
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .stat strong {
      display: block;
      font-size: 22px;
      line-height: 1.1;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    main { padding-bottom: 56px; }
    section { margin: 30px 0 38px; }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -.02em;
    }

    .section-head p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .search {
      width: min(290px, 100%);
      padding: 8px 10px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: var(--solid);
      font-size: 13px;
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(9,105,218,.10);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      position: relative;
      min-height: 124px;
      display: flex;
      flex-direction: column;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(9,105,218,.6);
      box-shadow: 0 9px 25px rgba(9,105,218,.10);
    }

    .card:focus-visible {
      outline: 3px solid rgba(9,105,218,.22);
      outline-offset: 2px;
    }

    .card.pinned {
      border-color: rgba(154,103,0,.35);
    }

    .web-card {
      min-height: 106px;
      border-top: 2px solid var(--green);
    }

    .card-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 8px;
    }

    .repo-name {
      margin: 0;
      color: var(--accent);
      font-size: 15px;
      line-height: 1.3;
      word-break: break-word;
    }

    .badges {
      display: flex;
      gap: 5px;
      flex: 0 0 auto;
      align-items: center;
    }

    .badge {
      padding: 3px 7px;
      border-radius: 999px;
      color: var(--accent);
      background: var(--soft);
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
    }

    .pin-badge {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      padding: 0;
      color: var(--pin-text);
      background: var(--pin-soft);
      font-size: 12px;
    }

    .desc {
      flex: 1;
      margin: 7px 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.48;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .web-card .desc {
      margin-bottom: 0;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 11px;
    }

    .lang-dot {
      width: 8px;
      height: 8px;
      display: inline-block;
      margin-right: 4px;
      border-radius: 50%;
      background: currentColor;
      vertical-align: 0;
    }

    .loading,
    .empty,
    .error {
      grid-column: 1 / -1;
      padding: 22px 16px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      text-align: center;
      font-size: 13px;
    }

    footer {
      padding: 21px 0 30px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      font-size: 12px;
    }

    .footer-line {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    @media (max-width: 920px) {
      .hero { grid-template-columns: auto 1fr; }

      .profile-links {
        grid-column: 1 / -1;
        max-width: none;
        justify-content: flex-start;
      }

      .profile-link {
        width: auto;
        min-width: 230px;
      }

      .grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }

    @media (max-width: 650px) {
      header { padding-top: 30px; }
      .avatar { width: 62px; height: 62px; }
      .stats { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }

      .section-head {
        align-items: stretch;
        flex-direction: column;
      }

      .search { width: 100%; }
      .profile-link { width: 100%; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="hero">
        <img
          class="avatar"
          id="avatar"
          src="https://avatars.githubusercontent.com/AaronChou313"
          alt="AaronChou313 avatar"
        />

        <div class="hero-copy">
          <h1 id="displayName">AaronChou313</h1>
          <p class="bio" id="bio">公开项目、实验与静态网页的集中展示页。</p>

          <div class="hero-actions">
            <a class="button primary" href="https://github.com/AaronChou313" target="_blank" rel="noreferrer" data-i18n="profile">GitHub 主页</a>
            <a class="button" href="#pages" data-i18n="webProjects">网页项目</a>
            <a class="button" href="#repositories" data-i18n="repositories">公开仓库</a>
            <button class="button lang-toggle" id="langToggle" type="button">EN</button>
          </div>
        </div>

        <div class="profile-links" id="profileLinks" aria-label="Featured profiles"></div>
      </div>

      <div class="stats">
        <div class="stat">
          <strong id="repoCount">—</strong>
          <span data-i18n="repoCount">公开仓库</span>
        </div>
        <div class="stat">
          <strong id="pageCount">—</strong>
          <span data-i18n="pageCount">GitHub Pages 项目</span>
        </div>
        <div class="stat">
          <strong id="starCount">—</strong>
          <span data-i18n="starCount">总 Stars</span>
        </div>
      </div>
    </header>

    <main>
      <section id="pages">
        <div class="section-head">
          <div>
            <h2 data-i18n="webProjects">网页项目</h2>
            <p data-i18n="webDesc">已部署 GitHub Pages 的静态网页项目。</p>
          </div>
        </div>
        <div id="pagesGrid" class="grid">
          <div class="loading" data-i18n="loadingPages">正在加载网页项目…</div>
        </div>
      </section>

      <section id="repositories">
        <div class="section-head">
          <div>
            <h2 data-i18n="repositories">公开仓库</h2>
            <p data-i18n="repoDesc">全部公开仓库，置顶项目优先，其余按最近更新时间排序。</p>
          </div>
          <input id="search" class="search" type="search" placeholder="搜索仓库…" aria-label="Search repositories" />
        </div>
        <div id="repoGrid" class="grid">
          <div class="loading" data-i18n="loadingRepos">正在加载公开仓库…</div>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-line">
        <span>© <span id="year"></span> AaronChou313</span>
        <span data-i18n="footer">由 GitHub Pages 托管 · projects.json 提供本地数据 · GitHub API 可选刷新</span>
      </div>
    </footer>
  </div>

  <script>
    const USER = "AaronChou313";
    const DATA_URL = "./projects.json";
    const PROFILE_API = `https://api.github.com/users/${USER}`;
    const REPOS_API = `https://api.github.com/users/${USER}/repos`;

    let siteConfig = {
      owner: USER,
      display_name: USER,
      description: {
        zh: "公开项目、实验与静态网页的集中展示页。",
        en: "A collection of public projects, experiments and static web pages."
      }
    };

    let profiles = [];
    let repos = [];
    let manualRepoConfig = new Map();

    let currentLang = "zh";
    try {
      currentLang = localStorage.getItem("lang") || "zh";
    } catch (_) {}

    const texts = {
      zh: {
        profile: "GitHub 主页",
        webProjects: "网页项目",
        repositories: "公开仓库",
        repoCount: "公开仓库",
        pageCount: "GitHub Pages 项目",
        starCount: "总 Stars",
        webDesc: "已部署 GitHub Pages 的静态网页项目。",
        repoDesc: "全部公开仓库，置顶项目优先，其余按最近更新时间排序。",
        loadingPages: "正在加载网页项目…",
        loadingRepos: "正在加载公开仓库…",
        footer: "由 GitHub Pages 托管 · projects.json 提供本地数据 · GitHub API 可选刷新",
        searchPlaceholder: "搜索仓库…",
        noMatch: "没有匹配的项目。",
        dataError: "projects.json 加载失败，正在尝试 GitHub API。",
        noDescription: "暂无项目说明。",
        githubPages: "GitHub Pages",
        updated: "更新于",
        pinned: "置顶"
      },
      en: {
        profile: "GitHub Profile",
        webProjects: "Web Projects",
        repositories: "Repositories",
        repoCount: "Public Repositories",
        pageCount: "GitHub Pages Projects",
        starCount: "Total Stars",
        webDesc: "Static web projects deployed with GitHub Pages.",
        repoDesc: "Pinned repositories first, then sorted by recent update.",
        loadingPages: "Loading web projects…",
        loadingRepos: "Loading repositories…",
        footer: "Hosted on GitHub Pages · local data from projects.json · optional GitHub API refresh",
        searchPlaceholder: "Search repositories…",
        noMatch: "No matching projects.",
        dataError: "Failed to load projects.json. Trying the GitHub API.",
        noDescription: "No description provided.",
        githubPages: "GitHub Pages",
        updated: "Updated",
        pinned: "Pinned"
      }
    };

    const escapeHtml = (value = "") =>
      String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));

    const localized = value => {
      if (!value) return "";
      if (typeof value === "string") return value;
      return value[currentLang] || value.zh || value.en || "";
    };

    const formatDate = value => {
      if (!value) return "";
      return new Intl.DateTimeFormat(currentLang === "zh" ? "zh-CN" : "en-US", {
        year: "numeric",
        month: "short",
        day: "numeric"
      }).format(new Date(value));
    };

    const projectDescription = repo => {
      const value = currentLang === "zh"
        ? (repo.description_zh || repo.description || "")
        : (repo.description_en || repo.description || "");
      return value || texts[currentLang].noDescription;
    };

    const repoUrl = repo =>
      repo.repo_url || repo.html_url || `https://github.com/${USER}/${encodeURIComponent(repo.name)}`;

    const webUrl = repo => {
      if (repo.web_url) return repo.web_url;
      if (repo.homepage && /^https?:\/\//i.test(repo.homepage)) return repo.homepage;
      return `https://${USER}.github.io/${encodeURIComponent(repo.name)}/`;
    };

    const isWebProject = repo =>
      repo.web_project === true ||
      (repo.web_project !== false && repo.has_pages === true);

    const pinOrder = repo => {
      if (repo.pin_order === null || repo.pin_order === undefined || repo.pin_order === "") {
        return Number.MAX_SAFE_INTEGER;
      }
      const value = Number(repo.pin_order);
      return Number.isFinite(value) ? value : Number.MAX_SAFE_INTEGER;
    };

    function sortProjects(list) {
      return [...list].sort((a, b) => {
        if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;

        if (a.pinned && b.pinned) {
          const byPinOrder = pinOrder(a) - pinOrder(b);
          if (byPinOrder !== 0) return byPinOrder;
        }

        return new Date(b.updated_at || 0) - new Date(a.updated_at || 0);
      });
    }

    function renderProfileLinks() {
      const container = document.getElementById("profileLinks");
      container.innerHTML = profiles.map(item => `
        <a class="profile-link" href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">
          <span class="mark">${escapeHtml(item.mark || "↗")}</span>
          <span>
            <strong>${escapeHtml(item.title || "")}</strong>
            <span class="subtitle">${escapeHtml(localized(item.subtitle))}</span>
          </span>
        </a>
      `).join("");
    }

    function applyLanguage() {
      const t = texts[currentLang];

      document.documentElement.lang = currentLang === "zh" ? "zh-CN" : "en";
      document.getElementById("langToggle").textContent = currentLang === "zh" ? "EN" : "中文";
      document.getElementById("search").placeholder = t.searchPlaceholder;
      document.getElementById("bio").textContent = localized(siteConfig.description) || t.noDescription;

      document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.dataset.i18n;
        if (t[key]) element.textContent = t[key];
      });

      document.querySelector('meta[name="description"]').setAttribute(
        "content",
        localized(siteConfig.description) || t.noDescription
      );

      document.title = currentLang === "zh"
        ? `${siteConfig.display_name || USER} · 项目主页`
        : `${siteConfig.display_name || USER} · Projects`;

      renderProfileLinks();
      renderPages();
      renderRepositories(filterRepos());
    }

    function pinBadge(repo) {
      return repo.pinned
        ? `<span class="badge pin-badge" title="${escapeHtml(texts[currentLang].pinned)}" aria-label="${escapeHtml(texts[currentLang].pinned)}">📌</span>`
        : "";
    }

    function repoCard(repo) {
      return `
        <a class="card ${repo.pinned ? "pinned" : ""}"
           href="${escapeHtml(repoUrl(repo))}"
           target="_blank"
           rel="noreferrer">
          <div class="card-top">
            <h3 class="repo-name">${escapeHtml(repo.name)}</h3>
            <div class="badges">
              ${repo.archived ? '<span class="badge">Archived</span>' : ""}
              ${pinBadge(repo)}
            </div>
          </div>

          <p class="desc">${escapeHtml(projectDescription(repo))}</p>

          <div class="meta">
            ${repo.language ? `<span><span class="lang-dot"></span>${escapeHtml(repo.language)}</span>` : ""}
            <span>★ ${repo.stargazers_count || 0}</span>
            <span>⑂ ${repo.forks_count || 0}</span>
            ${repo.updated_at ? `<span>${escapeHtml(texts[currentLang].updated)} ${escapeHtml(formatDate(repo.updated_at))}</span>` : ""}
          </div>
        </a>
      `;
    }

    function pageCard(repo) {
      return `
        <a class="card web-card ${repo.pinned ? "pinned" : ""}"
           href="${escapeHtml(webUrl(repo))}"
           target="_blank"
           rel="noreferrer">
          <div class="card-top">
            <h3 class="repo-name">${escapeHtml(repo.name)}</h3>
            <div class="badges">
              <span class="badge">${escapeHtml(texts[currentLang].githubPages)}</span>
              ${pinBadge(repo)}
            </div>
          </div>
          <p class="desc">${escapeHtml(projectDescription(repo))}</p>
        </a>
      `;
    }

    function filterRepos() {
      const keyword = document.getElementById("search").value.trim().toLowerCase();

      return sortProjects(repos.filter(repo => {
        if (repo.hidden) return false;
        if (!keyword) return true;

        const haystack = [
          repo.name,
          repo.description,
          repo.description_zh,
          repo.description_en,
          repo.language,
          ...(repo.topics || [])
        ].filter(Boolean).join(" ").toLowerCase();

        return haystack.includes(keyword);
      }));
    }

    function renderRepositories(list) {
      const grid = document.getElementById("repoGrid");

      if (!list.length) {
        grid.innerHTML = `<div class="empty">${escapeHtml(texts[currentLang].noMatch)}</div>`;
        return;
      }

      grid.innerHTML = list.map(repoCard).join("");
    }

    function renderPages() {
      const grid = document.getElementById("pagesGrid");

      const pageRepos = sortProjects(
        repos.filter(repo =>
          !repo.hidden &&
          isWebProject(repo) &&
          repo.name.toLowerCase() !== `${USER.toLowerCase()}.github.io`
        )
      );

      grid.innerHTML = pageRepos.length
        ? pageRepos.map(pageCard).join("")
        : `<div class="empty">${escapeHtml(texts[currentLang].noMatch)}</div>`;

      document.getElementById("pageCount").textContent = pageRepos.length;
    }

    function updateStats() {
      const visibleRepos = repos.filter(repo => !repo.hidden);
      document.getElementById("repoCount").textContent = visibleRepos.length;
      document.getElementById("starCount").textContent =
        visibleRepos.reduce((sum, repo) => sum + (repo.stargazers_count || 0), 0);
    }

    function normalizeManualRepo(repo) {
      return {
        ...repo,
        repo_url: repo.repo_url || `https://github.com/${USER}/${repo.name}`,
        pinned: repo.pinned === true,
        pin_order: repo.pin_order ?? null,
        hidden: repo.hidden === true
      };
    }

    async function loadProjectsJson() {
      const response = await fetch(DATA_URL, { cache: "no-store" });
      if (!response.ok) throw new Error(`projects.json ${response.status}`);

      const data = await response.json();

      siteConfig = { ...siteConfig, ...(data.site || {}) };
      profiles = Array.isArray(data.profiles) ? data.profiles : [];
      repos = Array.isArray(data.repositories)
        ? data.repositories.map(normalizeManualRepo)
        : [];

      manualRepoConfig = new Map(repos.map(repo => [repo.name, repo]));
    }

    async function fetchAllRepos() {
      const all = [];
      let page = 1;

      while (true) {
        const response = await fetch(
          `${REPOS_API}?per_page=100&page=${page}&sort=updated&type=owner`,
          { headers: { "Accept": "application/vnd.github+json" } }
        );

        if (!response.ok) throw new Error(`GitHub API ${response.status}`);

        const batch = await response.json();
        all.push(...batch);

        if (batch.length < 100) break;
        page += 1;
      }

      return all;
    }

    function mergeApiRepo(apiRepo) {
      const manual = manualRepoConfig.get(apiRepo.name) || {};

      return normalizeManualRepo({
        ...apiRepo,
        repo_url: manual.repo_url || apiRepo.html_url,
        description: apiRepo.description || manual.description || "",
        description_zh: manual.description_zh,
        description_en: manual.description_en,
        pinned: manual.pinned === true,
        pin_order: manual.pin_order ?? null,
        hidden: manual.hidden === true,
        web_project: manual.web_project !== undefined ? manual.web_project : undefined,
        web_url: manual.web_url || (apiRepo.homepage && /^https?:\/\//i.test(apiRepo.homepage) ? apiRepo.homepage : ""),
        has_pages: apiRepo.has_pages ?? manual.has_pages ?? false
      });
    }

    async function refreshReposFromGitHub() {
      try {
        const apiRepos = await fetchAllRepos();
        if (!Array.isArray(apiRepos) || !apiRepos.length) return;

        const apiNames = new Set(apiRepos.map(repo => repo.name));
        const merged = apiRepos.filter(repo => !repo.private).map(mergeApiRepo);
        const manualOnly = [...manualRepoConfig.values()].filter(repo => !apiNames.has(repo.name));

        repos = [...merged, ...manualOnly];
        updateStats();
        renderPages();
        renderRepositories(filterRepos());
      } catch (error) {
        console.warn("GitHub API refresh skipped; projects.json remains active:", error);
      }
    }

    async function refreshProfile() {
      try {
        const response = await fetch(PROFILE_API, {
          headers: { "Accept": "application/vnd.github+json" }
        });

        if (!response.ok) return;

        const profile = await response.json();

        document.getElementById("displayName").textContent =
          siteConfig.display_name || profile.name || profile.login || USER;

        if (profile.avatar_url) {
          document.getElementById("avatar").src = profile.avatar_url;
        }
      } catch (error) {
        console.warn("Profile refresh skipped:", error);
      }
    }

    async function init() {
      document.getElementById("year").textContent = new Date().getFullYear();

      document.getElementById("langToggle").addEventListener("click", () => {
        currentLang = currentLang === "zh" ? "en" : "zh";
        try { localStorage.setItem("lang", currentLang); } catch (_) {}
        applyLanguage();
      });

      document.getElementById("search").addEventListener("input", () => {
        renderRepositories(filterRepos());
      });

      try {
        await loadProjectsJson();

        document.getElementById("displayName").textContent =
          siteConfig.display_name || USER;

        applyLanguage();
        updateStats();
        renderPages();
        renderRepositories(filterRepos());

        refreshProfile();
        refreshReposFromGitHub();
      } catch (error) {
        console.error("projects.json load failed:", error);

        document.getElementById("repoGrid").innerHTML =
          `<div class="error">${escapeHtml(texts[currentLang].dataError)}</div>`;

        try {
          const apiRepos = await fetchAllRepos();
          repos = apiRepos.filter(repo => !repo.private).map(normalizeManualRepo);
          applyLanguage();
          updateStats();
          renderPages();
          renderRepositories(filterRepos());
        } catch (apiError) {
          console.error("GitHub API fallback also failed:", apiError);
        }
      }
    }

    init();
  </script>
</body>
</html>
