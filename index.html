<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="AaronChou313 的开源项目、网页工具与学习笔记，一站式访问入口" />
  <meta name="color-scheme" content="light dark" />
  <title>AaronChou313 · 项目导航</title>

  <link rel="stylesheet" href="./directory.css" />
</head>

<body>
  <a class="skip-link" href="#directory" data-i18n="skip">跳至项目目录</a>
  <div class="wrap">
    <header>
      <div class="hero">
        <img
          class="avatar"
          id="avatar"
          src="https://avatars.githubusercontent.com/AaronChou313"
          alt="AaronChou313 avatar"
        />

        <div class="hero-copy">
          <h1 id="displayName">AaronChou313</h1>
          <p class="bio" id="bio">从一个入口，探索开源项目、使用网页工具、阅读学习笔记。</p>

          <div class="hero-actions">
            <a class="button primary" href="https://github.com/AaronChou313" target="_blank" rel="noreferrer" data-i18n="profile">GitHub 主页</a>
            <a class="button" href="#tools" data-i18n="tools">网页工具</a>
            <a class="button" href="#notes" data-i18n="notes">学习笔记</a>
            <button class="button lang-toggle" id="langToggle" type="button">EN</button>
          </div>
        </div>

        <div class="profile-links" id="profileLinks" aria-label="Featured profiles"></div>
      </div>

      <div class="stats">
        <div class="stat">
          <strong id="repoCount">—</strong>
          <span data-i18n="repoCount">公开仓库</span>
        </div>
        <div class="stat">
          <strong id="pageCount">—</strong>
          <span data-i18n="pageCount">在线站点</span>
        </div>
        <div class="stat">
          <strong id="syncDate">—</strong>
          <span data-i18n="synced">目录更新</span>
        </div>
      </div>
    </header>

    <main id="directory" tabindex="-1">
      <section class="quick-access" aria-labelledby="quickTitle">
        <div class="section-head"><div><h2 id="quickTitle" data-i18n="quick">快速开始</h2><p data-i18n="quickDesc">打开工具，或者从一份笔记开始。</p></div></div>
        <div id="quickLinks" class="quick-grid"></div>
      </section>
      <div class="directory-toolbar">
        <nav class="filters" aria-label="分类" id="categoryFilters">
          <button type="button" data-category="all" aria-pressed="true" data-i18n="all">全部</button>
          <button type="button" data-category="tools" aria-pressed="false" data-i18n="tools">网页工具</button>
          <button type="button" data-category="projects" aria-pressed="false" data-i18n="projects">项目</button>
          <button type="button" data-category="notes" aria-pressed="false" data-i18n="notes">学习笔记</button>
        </nav>
        <div class="search-row"><label for="search" class="sr-only" data-i18n="searchLabel">搜索整个目录</label><input id="search" class="search" type="search" placeholder="搜索名称、用途、技术…" /><label class="online-filter"><input type="checkbox" id="onlineOnly" /><span data-i18n="onlineOnly">仅看在线入口</span></label></div>
      </div>
      <div class="result-line"><span id="resultCount" role="status" aria-live="polite"></span><button id="resetFilters" class="text-button" type="button" hidden data-i18n="reset">清除筛选</button></div>
      <div id="loadStatus" role="status" class="loading" data-i18n="loading">正在加载目录…</div>
      <noscript><p class="error">请启用 JavaScript 浏览分类目录，或<a href="https://github.com/AaronChou313?tab=repositories">前往 GitHub 查看全部仓库</a>。</p></noscript>
      <section id="tools" aria-labelledby="toolsTitle"><div class="section-head"><div><h2 id="toolsTitle"><span data-i18n="tools">网页工具</span> <span class="section-count" id="toolsCount"></span></h2><p data-i18n="toolsDesc">在浏览器中使用，探索、创作与学习。</p></div></div><div id="toolsGrid" class="grid"></div></section>
      <section id="notes" aria-labelledby="notesTitle"><div class="section-head"><div><h2 id="notesTitle"><span data-i18n="notes">学习笔记</span> <span class="section-count" id="notesCount"></span></h2><p data-i18n="notesDesc">课程笔记、研究知识库与可复现的学习实践。</p></div></div><div id="notesGrid" class="grid"></div></section>
      <section id="projects" aria-labelledby="projectsTitle"><div class="section-head"><div><h2 id="projectsTitle"><span data-i18n="projects">项目</span> <span class="section-count" id="projectsCount"></span></h2><p data-i18n="projectsDesc">开源软件、开发工具、机器人与课程实践；从源码了解和运行。</p></div></div><div id="projectsGrid" class="grid"></div></section>
      <div id="emptyState" class="empty" hidden><p data-i18n="noMatch">没有找到匹配的内容，试试其他关键词。</p><button id="emptyReset" class="button" type="button" data-i18n="reset">清除筛选</button></div>
      <span id="pages" class="legacy-anchor" aria-hidden="true"></span><span id="repositories" class="legacy-anchor" aria-hidden="true"></span>
    </main>

    <footer>
      <div class="footer-line">
        <span>© <span id="year"></span> AaronChou313</span>
        <span data-i18n="footer">公开项目目录 · GitHub Pages</span>
      </div>
    </footer>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
